<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940" role="img" aria-labelledby="title desc">
  <title id="title">An engineering loop with agents</title>
  <desc id="desc">Review the plan, delegate implementation, verify the result, and learn from the outcome before planning the next change.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#081c30"/>
      <stop offset="1" stop-color="#12394a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2 2 10 6 2 10" fill="none" stroke="#8adad8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="940" rx="28" fill="url(#bg)"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="64" y="70" fill="#fff" font-size="33" font-weight="700">An engineering loop with agents</text>
    <text x="64" y="107" fill="#b8d3de" font-size="22">Where judgment, execution, and learning meet</text>
    <g stroke-width="2">
      <rect x="64" y="150" width="550" height="144" rx="18" fill="#12394a" stroke="#5bc9cc"/>
      <rect x="64" y="350" width="550" height="144" rx="18" fill="#34302a" stroke="#e9b971"/>
      <rect x="64" y="550" width="550" height="144" rx="18" fill="#12394a" stroke="#5bc9cc"/>
      <rect x="64" y="750" width="550" height="144" rx="18" fill="#12394a" stroke="#5bc9cc"/>
    </g>
    <g fill="#8ee4df" font-size="18" font-weight="700" letter-spacing="2">
      <text x="94" y="185">HUMAN JUDGMENT</text>
      <text x="94" y="585">HUMAN + AGENT</text>
      <text x="94" y="785">HUMAN LEARNING</text>
    </g>
    <text x="94" y="385" fill="#f3c88d" font-size="18" font-weight="700" letter-spacing="2">DELEGATED EXECUTION</text>
    <g fill="#fff" font-size="30" font-weight="650">
      <text x="94" y="227">Review the plan</text>
      <text x="94" y="427">Implement the agreed work</text>
      <text x="94" y="627">Verify the result</text>
      <text x="94" y="827">Learn and revise</text>
    </g>
    <g fill="#c8dbe3" font-size="21">
      <text x="94" y="263">Constraints, boundaries, failure modes</text>
      <text x="94" y="463">Code, wiring, and repetitive implementation</text>
      <text x="94" y="663">Tests, real behavior, and review evidence</text>
      <text x="94" y="863">Understand the tradeoffs; improve the next plan</text>
    </g>
    <g fill="none" stroke="#8adad8" stroke-width="3" marker-end="url(#arrow)">
      <path d="M339 303v34"/>
      <path d="M339 503v34"/>
      <path d="M339 703v34"/>
      <path d="M625 820h31V222h-29" stroke-dasharray="7 7"/>
    </g>
  </g>
</svg>
